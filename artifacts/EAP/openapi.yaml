openapi: 3.0.0

info:
  version: '1.0'
  title: 'LBAW DreamTask API'
  description: 'Web Resources Specification (A7) for DreamTask'

servers:
- url: http://lbaw.fe.up.pt
  description: Production server

tags:
  - name: 'M01: Authentication and Individual Profile'
  - name: 'M02: Projects and Teams'
  - name: 'M03: Comments'
  - name: 'M04: User Administration and Static pages'

paths:
  /login:
    get:
      operationId: R101
      summary: 'R101: Login Form'
      description: 'Provide login form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show Log-in UI'
    post:
      operationId: R102
      summary: 'R102: Login Action'
      description: 'Processes the login form submission. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:          # <!--- form field name
                  type: string
                password:    # <!--- form field name
                  type: string
              required:
                    - email
                    - password
      responses:
        '302':
          description: 'Redirect after processing the login credentials.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful authentication. Redirect to user profile.'
                  value: '/User/{id_user}'
                302Error:
                  description: 'Failed authentication. Redirect to login form.'
                  value: '/login'

  /logout:
    post:
      operationId: R103
      summary: 'R103: Logout Action'
      description: 'Logout the current authenticated user. Access: USR, ADM'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '302':
          description: 'Redirect after processing logout.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful logout. Redirect to login form.'
                  value: '/login'

  /register:
    get:
      operationId: R104
      summary: 'R104: Register Form'
      description: 'Provide new user registration form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show Sign-Up UI'

    post:
      operationId: R105
      summary: 'R105: Register Action'
      description: 'Processes the new user registration form submission. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                picture:
                  type: string
                  format: binary
              required:
                  - email
                  - password
      responses:
        '302':
          description: 'Redirect after processing the new user information.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful authentication. Redirect to user profile.'
                  value: '/User/{id_user}'
                302Failure:
                  description: 'Failed authentication. Redirect to login form.'
                  value: '/login'

  /User/{id_user}:
    get:
      operationId: R106
      summary: 'R106: View user profile'
      description: 'Show the individual user profile. Access: USR'
      tags:
        - 'M01: Authentication and Individual Profile'

      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true

      responses:
        '200':
          description: 'Ok. Show User Profile UI'

  get:
     operationId: R107
     summary: 'R107: Edit Profile Form'
     description: 'Provide Edit Profile Form. Access: OWN'
     tags:
       - 'M01: Authentication and Individual Profile'
     responses:
       '200':
         description: 'Ok. Show Edit Profile UI'

  /User/{id_user}/edit:
   post:
     operationId: R108
     summary: 'R108: Edit Profile Action'
     description: 'Processes the Edit Profile Form submission. Access: OWN'
     tags:
       - 'M01: Authentication and Individual Profile'

     requestBody:
       required: true
       content:
         application/x-www-form-urlencoded:
           schema:
             type: object
             properties:
               username:
                 type: string
               first_name:
                 type: string
               last_name:
                 type: string
               email:
                 type: string
               description:
                 type: string
               password:
                 type: string
             required:
                  - username
                  - first_name
                  - last_name
                  - email
                  - description
                  - password

     responses:
       '302':
         description: 'Redirect after processing the Edit Profile credentials.'
         headers:
           Location:
             schema:
               type: string
             examples:
               302Success:
                 description: 'Successful edited profile. Redirect to user profile.'
                 value: '/User/{id_user}'
               302Error:
                 description: 'Failed edited profile. Redirect to user profile.'
                 value: '/User/{id_user}'

  /api/Project:
   get:
     operationId: R201
     summary: 'R201: Search Project API'
     description: 'Searches for projects and returns the results as JSON. Access: PUB.'

     tags:
       - 'M02: Projects and Teams'

     parameters:
       - in: query
         name: query
         description: String to use for full-text search
         schema:
           type: string
         required: false
       - in: query
         name: item
         description: Company of the projects
         schema:
           type: string
         required: false

     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               type: array
               items:
                 type: object
                 properties:
                   id:
                     type: string
                   name:
                     type: string
                   description:
                     type: string
                   company:
                     type: string
                   creation_date:
                     type: string
                   current_edit_data:
                     type: string
               example:
                 - id: 1
                   name: Project 1
                   description: Description of Project 1
                   company: Company 1
                   creation_date: 2022-11-20
                   current_edit_data: 2022-11-21
  /about:
   get:
     operationId: R401
     summary: 'R401: About'
     description: 'Provide information about the app. Access: PUB'
     tags:
       - 'M04: User Administration and Static pages'
     responses:
       '200':
         description: 'Ok. Show about page'
  /services:
   get:
     operationId: R402
     summary: 'R402: Services'
     description: 'Provide information about the services of the app. Access: PUB'
     tags:
       - 'M04: User Administration and Static pages'
     responses:
       '200':
         description: 'Ok. Show services page'
  /faq:
   get:
     operationId: R403
     summary: 'R403: FAQ'
     description: 'Provide information about the most frequent questions of the users. Access: PUB'
     tags:
       - 'M04: User Administration and Static pages'
     responses:
       '200':
         description: 'Ok. Show FAQ page'
